# Included in every location: an add_header inside a location replaces all
# headers inherited from the server block.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The edge (Cloudflare Tunnel) terminates HTTPS; browsers ignore HSTS over plain HTTP.
add_header Strict-Transport-Security "max-age=31536000" always;
# Enforced: only Telegram may frame the Mini App (Telegram Web runs it in an iframe).
add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; object-src 'none'; base-uri 'self'" always;
# Report-only until verified inside Telegram clients and TON Connect wallets;
# then move these directives into the enforced header above.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'none'; form-action 'self'" always;
