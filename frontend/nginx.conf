server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # The host ingress reaches the published loopback port through Docker, which
  # connects from the edge network gateway (the subnet's first address in
  # docker-compose.prod.yml). Only that peer may name the client: its rightmost
  # untrusted X-Forwarded-For entry. Without the header the gateway stays the address.
  set_real_ip_from 172.29.7.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml;
  include /etc/nginx/snippets/security-headers.conf;
  location = /tonconnect-manifest.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store";
    if ($request_method = OPTIONS) { return 204; }
    try_files $uri =404;
  }
  location = /tonconnect-icon.png {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }
  location /api/ {
    proxy_pass http://backend-node:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 20s;
  }
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
