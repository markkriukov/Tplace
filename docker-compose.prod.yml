services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tplace
      POSTGRES_DB: tplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - production_database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tplace -d tplace"]
      interval: 5s
      retries: 20
    networks: [private]
  database-init:
    build:
      context: .
      dockerfile: backend/node/Dockerfile.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the production DATABASE_URL with host postgres}
    command: [sh, -c, "npm run db:migrate && npm run db:catalog:sync"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private, edge]
  backend-node:
    build:
      context: .
      dockerfile: backend/node/Dockerfile.prod
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      CUSTODY_TELEGRAM_USER_ID: ${CUSTODY_TELEGRAM_USER_ID:?Set the verified Telegram custodian ID}
      CUSTODY_MAX_AGE_SECONDS: ${CUSTODY_MAX_AGE_SECONDS:-7200}
      TRUSTED_PROXY_ADDRESSES: 172.29.7.3
      HTTP_RATE_LIMIT: ${HTTP_RATE_LIMIT:-300}
      HTTP_WRITE_RATE_LIMIT: ${HTTP_WRITE_RATE_LIMIT:-120}
      HTTP_AUTH_RATE_LIMIT: ${HTTP_AUTH_RATE_LIMIT:-30}
      HTTP_USER_RATE_LIMIT: ${HTTP_USER_RATE_LIMIT:-300}
      HTTP_USER_WRITE_RATE_LIMIT: ${HTTP_USER_WRITE_RATE_LIMIT:-120}
      TON_NETWORK: ${TON_NETWORK:--239}
      TON_RPC_URL: ${TON_RPC_URL:-}
      TON_RPC_API_KEY: ${TON_RPC_API_KEY:-}
      TON_TREASURY_ADDRESS: ${TON_TREASURY_ADDRESS:-}
      TON_TREASURY_MNEMONIC_FILE: ${TON_TREASURY_MNEMONIC_FILE:-}
      TON_PAYOUTS_ENABLED: ${TON_PAYOUTS_ENABLED:-false}
      TON_WITHDRAW_FEE_NANO: ${TON_WITHDRAW_FEE_NANO:-50000000}
      TON_PAYOUT_BATCH_SIZE: ${TON_PAYOUT_BATCH_SIZE:-4}
      MARKETPLACE_MIN_PRICE: ${MARKETPLACE_MIN_PRICE:-0.5}
      MARKETPLACE_MAX_PRICE: ${MARKETPLACE_MAX_PRICE:-100000}
      MARKETPLACE_FEE_BPS: ${MARKETPLACE_FEE_BPS:-50}
      DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-0}
      DB_POOL_MAX: ${DB_POOL_MAX:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-600}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-21600}
    volumes:
      - ./deploy/secrets:/run/secrets:ro
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [private, edge]
  operations-monitor:
    build:
      context: .
      dockerfile: backend/node/Dockerfile.prod
    restart: unless-stopped
    init: true
    command: [node, scripts/monitor-operations.js]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      CUSTODY_RECONCILE_ALERTS: ${CUSTODY_RECONCILE_ALERTS:-false}
      CUSTODY_RECONCILE_ALERT_AFTER_SECONDS: ${CUSTODY_RECONCILE_ALERT_AFTER_SECONDS:-7200}
    depends_on:
      backend-node:
        condition: service_healthy
    networks: [private]
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_TONCONNECT_APP_URL: ${VITE_TONCONNECT_APP_URL:?Set the public HTTPS app URL}
        VITE_TONCONNECT_MANIFEST_URL: ${VITE_TONCONNECT_MANIFEST_URL:-}
        VITE_TONCONNECT_TWA_RETURN_URL: ${VITE_TONCONNECT_TWA_RETURN_URL:-}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      backend-node:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.29.7.3
  backend-python:
    build: ./backend/python-worker
    restart: unless-stopped
    init: true
    profiles: [sync]
    environment:
      DATABASE_URL: ${PYTHON_DATABASE_URL:?Set PYTHON_DATABASE_URL with postgresql+psycopg scheme}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_NAME: ${TELEGRAM_SESSION_NAME:-account}
      CUSTODY_RECONCILE_INTERVAL_SECONDS: ${CUSTODY_RECONCILE_INTERVAL_SECONDS:-3600}
      GIFT_WITHDRAW_MAX_STARS: ${GIFT_WITHDRAW_MAX_STARS:-25}
      GIFT_CUSTODY_SCAN_TIMEOUT_SECONDS: ${GIFT_CUSTODY_SCAN_TIMEOUT_SECONDS:-60}
      TELEGRAM_SESSION_WORKDIR: /app/runtime
      CUSTODY_TELEGRAM_USER_ID: ${CUSTODY_TELEGRAM_USER_ID:?Set the verified Telegram custodian ID}
    volumes: ["production_telegram_session:/app/runtime"]
    depends_on:
      database-init:
        condition: service_completed_successfully
    networks: [private, edge]
networks:
  private:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.29.7.0/24
volumes:
  production_database:
  production_telegram_session:
